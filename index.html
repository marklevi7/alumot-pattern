<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alumot pattern</title>
  <style>
    :root {
      --ink: #1F1830;
      --paper: #FAF8F4;
      --line: rgba(31, 24, 48, 0.15);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--paper); color: var(--ink);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    header {
      display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end;
      padding: 14px 18px; border-bottom: 1px solid var(--line);
      background: var(--paper);
    }
    h1 { margin: 0 12px 0 0; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #6a6478; text-transform: uppercase; letter-spacing: 0.08em; }
    input[type="number"], select {
      font: inherit; color: var(--ink);
      padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px;
      background: #fff; min-width: 110px;
    }
    input[type="number"] { min-width: 80px; }
    button {
      font: inherit; padding: 7px 12px; border: 1px solid var(--ink);
      background: var(--ink); color: var(--paper); border-radius: 4px;
      cursor: pointer; letter-spacing: 0.04em;
    }
    button.secondary { background: transparent; color: var(--ink); }
    .stage { flex: 1; display: flex; align-items: stretch; justify-content: stretch; padding: 18px; }
    .canvas-wrap {
      flex: 1; position: relative; overflow: hidden;
      border: 1px solid var(--line); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    canvas { display: block; max-width: 100%; max-height: 100%; }
    footer { padding: 10px 18px; border-top: 1px solid var(--line); color: #6a6478; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Alumot pattern</h1>

    <label>Variant
      <select id="variant">
        <option value="light">Light (paper / purple)</option>
        <option value="dark">Dark (plum / lavender)</option>
        <option value="mono-light">Mono light</option>
        <option value="mono-dark">Mono dark</option>
      </select>
    </label>

    <label>U (px)
      <input id="u" type="number" value="10" min="2" max="80" step="1">
    </label>

    <label>Width
      <input id="w" type="number" value="1600" min="100" max="6000" step="10">
    </label>

    <label>Height
      <input id="h" type="number" value="900" min="100" max="6000" step="10">
    </label>

    <label>Seed
      <input id="seed" type="number" value="42" step="1">
    </label>

    <button id="regen">Regenerate</button>
    <button id="random" class="secondary">Random seed</button>
    <button id="download" class="secondary">Download SVG</button>
  </header>

  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="c"></canvas>
    </div>
  </div>

  <footer id="status">Ready.</footer>

  <script src="pattern.js"></script>
  <script>
    const { VARIANTS, generateDashes, drawCanvas, toSvg } = window.AlumotPattern;

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    const el = id => document.getElementById(id);

    function currentOpts() {
      const variant = el('variant').value;
      const v = VARIANTS[variant];
      return {
        width:  +el('w').value,
        height: +el('h').value,
        U:      +el('u').value,
        seed:   +el('seed').value,
        variant,
        bg: v.bg,
        fg: v.fg,
      };
    }

    function render() {
      const o = currentOpts();
      // Render at actual pixel size; let CSS shrink it to fit.
      const dpr = window.devicePixelRatio || 1;
      canvas.width = o.width * dpr;
      canvas.height = o.height * dpr;
      canvas.style.width = o.width + 'px';
      canvas.style.height = o.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const dashes = generateDashes(o);
      drawCanvas(ctx, { ...o, dashes });
      status.textContent = o.width + '×' + o.height + ', U=' + o.U +
                           ', variant=' + o.variant + ', seed=' + o.seed +
                           ' — ' + dashes.length + ' dashes';
    }

    el('regen').addEventListener('click', render);
    el('variant').addEventListener('change', render);
    ['u', 'w', 'h', 'seed'].forEach(id => el(id).addEventListener('change', render));

    el('random').addEventListener('click', () => {
      el('seed').value = Math.floor(Math.random() * 2 ** 31);
      render();
    });

    el('download').addEventListener('click', () => {
      const o = currentOpts();
      const dashes = generateDashes(o);
      const svg = toSvg({ ...o, dashes });
      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'alumot-' + o.variant + '-' + o.seed + '.svg';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    });

    render();
  </script>
</body>
</html>
